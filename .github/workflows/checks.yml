name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Documents and secrets
        run: python3 .github/scripts/verify_repo.py

      - name: Bundled toolchain fingerprint
        run: python3 .github/scripts/verify_hosttools.py
