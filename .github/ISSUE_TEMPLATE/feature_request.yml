name: Feature request
description: Propose a capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: If this involves a new tool, describe what the model would call and what it returns.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including doing nothing, and workarounds with existing tools.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent runtime
        - Built-in tools
        - On-device toolchain
        - Build environment
        - UI
        - Settings
        - Documentation
        - Other
    validations:
      required: true
